<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # Render は HTTPS を手前で処理するため、Laravel が https として扱えるようにする
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
